services:
  trimon:
    build:
      context: ../../
      target: debug
    image: trimon:dev
    container_name: trimon-dev
    cap_add:
      - NET_RAW
    volumes:
      - ./trimon.yaml:/etc/trimon/config.yaml:ro
    ports:
      - "8080:8080"
    depends_on:
      - otelcol
    networks:
      - observability
    restart: unless-stopped

  otelcol:
    image: otel/opentelemetry-collector-contrib:0.104.0
    container_name: otelcol-dev-stack
    volumes:
      - ./otelcol-config.yaml:/etc/otelcol-contrib/config.yaml
    ports:
      - "4317:4317"   # OTLP gRPC
      - "4318:4318"   # OTLP HTTP
      - "8889:8889"   # Prometheus exporter
    networks:
      - observability

  prometheus:
    image: prom/prometheus:v2.53.0
    container_name: prometheus-dev-stack
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    depends_on:
      - otelcol
    networks:
      - observability

  grafana:
    image: grafana/grafana:11.1.0
    container_name: grafana-dev-stack
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning
      - grafana_data:/var/lib/grafana
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
    networks:
      - observability

volumes:
  prometheus_data:
  grafana_data:

networks:
  observability:
    driver: bridge
