global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: otelcol-prometheus
    scrape_interval: 15s
    scrape_timeout: 10s
    static_configs:
      - targets:
          - otelcol:8889

  - job_name: trimon
    scrape_interval: 15s
    scrape_timeout: 10s
    static_configs:
      - targets:
          - trimon:8080
