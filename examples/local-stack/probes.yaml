global:
  probe_every: 30s
  timeout: 10s
  count: 3
  source_ip: ""

probes:
  - name: internet
    type: icmp
    targets:
      - "8.8.8.8"
      - "1.1.1.1"
      - "dns.google"
    count: 10
    timeout: 11s

  - name: openDNS
    type: icmp
    targets:
      - "208.67.220.220"
      - "208.67.222.222"
    probe_every: 20s
    count: 8

  # UDP probe (v0.4.0): public DNS resolvers are a reliable public UDP endpoint,
  # so this doubles as the runtime smoke target. Any reply within the timeout
  # counts as reachable; a timeout or ICMP port-unreachable is loss. payload is a
  # raw DNS query for the root NS record, written with YAML \xNN byte escapes
  # (the bytes are what matter, not a hex string). expected_response is empty, so
  # any reply = success. For real DNS answer validation, use the dns probe type.
  - name: dns-udp
    type: udp
    targets:
      - "8.8.8.8"
      - "1.1.1.1"
    probe_every: 20s
    timeout: 2s
    count: 3
    packet_interval: 200ms
    udp:
      port: 53
      payload: "\x00\x00\x01\x00\x00\x01\x00\x00\x00\x00\x00\x00\x00\x00\x02\x00\x01"
    labels:
      probe_id: "dns-udp"

  # DNS probe (v0.4.0): proper DNS query with answer validation and resolver RTT.
  # Queries a public resolver for dns.google's A records and asserts the answer
  # is one of Google's well-known IPs. Doubles as the runtime smoke for the dns
  # probe type.
  - name: dns-resolve
    type: dns
    targets:
      - "dns.google"
    probe_every: 20s
    timeout: 2s
    count: 3
    packet_interval: 200ms
    dns:
      record_type: A
      resolver: "1.1.1.1:53"
      expected_answer:
        - "8.8.8.8"
        - "8.8.4.4"
    labels:
      probe_id: "dns-resolve"

  # TCP probe (v0.4.0): connect-mode handshake against a reliably-open public
  # port (HTTPS/443 on the public resolvers). trimon_probe_port_open=1 means open
  # (SYN/ACK or completed connect); a RST would be port_open=0 with up=1 (host
  # reachable, port closed); only a timeout is loss (status=failure, up=0).
  # Doubles as the runtime smoke for the tcp probe type.
  - name: tcp-https
    type: tcp
    targets:
      - "1.1.1.1"
      - "8.8.8.8"
    probe_every: 20s
    timeout: 2s
    count: 3
    packet_interval: 200ms
    tcp:
      port: 443
      mode: connect
    labels:
      probe_id: "tcp-https"

  # HTTP probe (v0.4.0): HTTPS GET against a stable public endpoint. Exercises
  # status-code matching, single-request duration (trimon_probe_duration_milliseconds),
  # and TLS certificate expiry (status=partial within tls_expiry_warning_days of
  # expiry, failure once expired). HTTP sends exactly one request per tick, so
  # count/packet_interval do not apply. Doubles as the runtime smoke for http.
  - name: http-example
    type: http
    targets:
      - "example.com"
    probe_every: 20s
    timeout: 5s
    http:
      scheme: https
      path: /
      expected_status: 200
      tls_expiry_warning_days: 14
    labels:
      probe_id: "http-example"
