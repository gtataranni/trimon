global:
  probe_every: 30s
  timeout: 10s
  count: 3
  source_ip: ""

probes:
  - name: internet
    type: icmp
    targets:
      - "8.8.8.8"
      - "1.1.1.1"
      - "dns.google"
    count: 10
    timeout: 11s

  - name: openDNS
    type: icmp
    targets:
      - "208.67.220.220"
      - "208.67.222.222"
    probe_every: 20s
    count: 8
