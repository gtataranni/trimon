# Ops config, passed via --config flag.
# Contains deployment-specific settings.
# Never exposed via the /config HTTP endpoint.

exporters:
  stdout:
    enabled: true
    format: json     # json | text

  # otlp:
  #   enabled: false
  #   endpoint: "localhost:4317"
  #   protocol: grpc   # grpc | http
  #   insecure: true
  #   tls:
  #     cert_file: ""
  #     key_file: ""
  #     ca_file: ""
  #   batch:
  #     export_interval: 30s
  #     export_timeout: 10s
  #   retry:
  #     enabled: true
  #     max_elapsed_time: 300s

server:
  # Bind to loopback by default. Change to ":8080" to expose on all interfaces
  # (e.g. when running in a container or behind a reverse proxy).
  listen: "127.0.0.1:8080"

