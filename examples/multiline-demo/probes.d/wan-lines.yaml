probes:
  - name: fiber-internet-gw
    type: icmp
    targets:
      - "172.20.0.100"
    source_ip: "172.20.0.2"
    count: 5
    labels:
      wan_line: fiber
      provider: fiber-isp
      target_type: internet_gateway

  - name: cable-internet-gw
    type: icmp
    targets:
      - "172.21.0.100"
    source_ip: "172.21.0.2"
    count: 5
    labels:
      wan_line: cable
      provider: cable-isp
      target_type: internet_gateway

  - name: vsat-internet-gw
    type: icmp
    targets:
      - "172.22.0.100"
    source_ip: "172.22.0.2"
    count: 5
    packet_interval: 500ms
    timeout: 8s
    labels:
      wan_line: vsat
      provider: vsat-provider
      target_type: internet_gateway
