global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: otelcol-prometheus
    scrape_interval: 15s
    scrape_timeout: 10s
    static_configs:
      - targets:
          - otelcol:8889

  - job_name: trimon
    scrape_interval: 15s
    scrape_timeout: 10s
    static_configs:
      - targets:
          - trimon:8080
    # trimon_probe_* metrics are already scraped via the otelcol-prometheus job
    # (trimon pushes them via OTLP; the collector re-exposes them with richer
    # resource-attribute labels). Drop them here to avoid duplicate time series.
    # Self-observability metrics (build_info, scheduler_goroutines, etc.) are
    # not pushed via OTLP, so we keep this job for those.
    metric_relabel_configs:
      - source_labels: [__name__]
        regex: 'trimon_probe_(rtt_.*|packet_loss_ratio|packets_sent_total|packets_received_total|success|up)'
        action: drop
