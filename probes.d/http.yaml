# HTTP probes. HTTP probes always send one request per tick — count and
# packet_interval are unused.

probes:
  # Google generate_204 — Android/ChromeOS captive-portal / connectivity check.
  # Expects HTTP 204 No Content; any redirect indicates a captive portal.
  - name: connectivity-google
    type: http
    targets:
      - "connectivitycheck.gstatic.com"
    probe_every: 30s
    timeout: 5s
    http:
      scheme: http
      path: /generate_204
      expected_status: 204
      follow_redirects: false
    labels:
      check: captive-portal

  # Apple captive-portal / connectivity check (iOS, macOS).
  # Expects HTTP 200 with a small "Success" page; redirect = captive portal.
  - name: connectivity-apple
    type: http
    targets:
      - "captive.apple.com"
    probe_every: 30s
    timeout: 5s
    http:
      scheme: http
      path: /hotspot-detect.html
      expected_status: 200
      follow_redirects: false
    labels:
      check: captive-portal

  # Microsoft NCSI — Windows Network Connectivity Status Indicator.
  # Expects HTTP 200 with body "Microsoft Connect Test".
  - name: connectivity-msft
    type: http
    targets:
      - "www.msftconnecttest.com"
    probe_every: 30s
    timeout: 5s
    http:
      scheme: http
      path: /connecttest.txt
      expected_status: 200
      follow_redirects: false
    labels:
      check: captive-portal

  # Exact status match, custom port, no redirect following.
  - name: api-health
    type: http
    targets:
      - "10.0.0.5"
    probe_every: 30s
    timeout: 5s
    http:
      scheme: http
      port: 8080
      path: /healthz
      expected_status: 200
      follow_redirects: false
