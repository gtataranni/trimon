# Example probe config for container deployments, passed via --probes flag.

global:
  probe_every: 30s
  timeout: 5s
  count: 3
  source_ip: ""   # empty = use the container's default interface

probes:
  - name: internet
    type: icmp
    targets:
      - "dns.google"
      - "1.1.1.1"
    timeout: 11s
    count: 10
    labels:
      probe_id: "wan0"
