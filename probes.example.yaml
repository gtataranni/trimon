# Probe config, passed via --probes flag.
# Contains probe targets, intervals, and labels.
# Returned verbatim by the /config HTTP endpoint.
# Safe to expose to unprivileged users.

global:
  probe_every: 30s   # default probe interval
  timeout: 5s        # default probe timeout
  count: 3           # default ICMP echo count
  source_ip: ""      # set a daemon-wide source IP or override per probe

probes:
  # Multi-target probe: all targets share the same probe.name label ("internet").
  # Hostnames are re-resolved at every probe tick — each resolved IP gets its own
  # ProbeResult with probe.target=IP and probe.fqdn=hostname.
  # Area-level status in dashboards: max by (probe_name)(trimon_probe_up)
  - name: internet
    type: icmp
    targets:
      - "8.8.8.8"
      - "1.1.1.1"
      - "dns.google"     # FQDN: expands to all resolved IPs at probe time
    source_ip: "192.168.1.10"   # must be an IP assigned to a local interface
    probe_every: 10s
    timeout: 6s
    count: 5
    max_resolved_ips: 4         # optional: cap IPs per FQDN entry (0 = unlimited)
    labels:
      probe_id: "wan0"
      site: "primary"

  # Single-target probe (equivalent to targets: ["192.168.1.1"]).
  - name: home-router
    type: icmp
    targets:
      - "192.168.1.1"
    probe_every: 30s
    labels:
      probe_id: "lan0"

  # HTTP probe: Google generate_204 — Android/ChromeOS captive-portal / connectivity check.
  # Expects HTTP 204 No Content; any redirect indicates a captive portal.
  # HTTP probes always send one request per tick — count and packet_interval are unused.
  - name: connectivity-google
    type: http
    targets:
      - "connectivitycheck.gstatic.com"
    probe_every: 30s
    timeout: 5s
    http:
      scheme: http
      path: /generate_204
      expected_status: 204
      follow_redirects: false
    labels:
      check: captive-portal

  # HTTP probe: Apple captive-portal / connectivity check (iOS, macOS).
  # Expects HTTP 200 with a small "Success" page; redirect = captive portal.
  - name: connectivity-apple
    type: http
    targets:
      - "captive.apple.com"
    probe_every: 30s
    timeout: 5s
    http:
      scheme: http
      path: /hotspot-detect.html
      expected_status: 200
      follow_redirects: false
    labels:
      check: captive-portal

  # HTTP probe: Microsoft NCSI — Windows Network Connectivity Status Indicator.
  # Expects HTTP 200 with body "Microsoft Connect Test".
  - name: connectivity-msft
    type: http
    targets:
      - "www.msftconnecttest.com"
    probe_every: 30s
    timeout: 5s
    http:
      scheme: http
      path: /connecttest.txt
      expected_status: 200
      follow_redirects: false
    labels:
      check: captive-portal

  # HTTP probe: exact status match, custom port, no redirect following.
  - name: api-health
    type: http
    targets:
      - "10.0.0.5"
    probe_every: 30s
    timeout: 5s
    http:
      scheme: http
      port: 8080
      path: /healthz
      expected_status: 200
      follow_redirects: false

  # TCP probe (connect mode, the default): open a full connection to a port and
  # measure the handshake time. A SYN/ACK (open) or a RST (closed) both count as
  # the host being reachable; only a timeout is loss (status=failure). The
  # trimon_probe_tcp_port_open metric (1=open, 0=closed/no-reply) tells open from
  # closed. Count/packet_interval control how many attempts are made per tick.
  - name: ssh-gateway
    type: tcp
    targets:
      - "192.168.1.1"
      - "github.com"   # FQDN: expands to all resolved IPs at probe time
    probe_every: 30s
    timeout: 5s
    count: 3
    packet_interval: 1s
    tcp:
      port: 22
      mode: connect    # "connect" (default) or "syn"
    labels:
      service: ssh

  # TCP probe (SYN mode): send a raw half-open SYN and classify the reply without
  # completing the handshake — measures network round-trip and port reachability.
  - name: https-reachability
    type: tcp
    targets:
      - "1.1.1.1"
    probe_every: 30s
    timeout: 2s
    count: 3
    packet_interval: 1s
    tcp:
      port: 443
      mode: syn
    labels:
      service: https
