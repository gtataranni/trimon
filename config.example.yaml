global:
  probe_every: 30s   # default probe interval
  timeout: 5s        # default probe timeout
  count: 3           # default ICMP echo count
  source_ip: ""      # set a daemon-wide source IP or override per probe

exporters:
  stdout:
    enabled: true
    format: json     # json | text

  # otlp:
  #   enabled: false
  #   endpoint: "localhost:4317"
  #   protocol: grpc   # grpc | http
  #   insecure: true
  #   tls:
  #     cert_file: ""
  #     key_file: ""
  #     ca_file: ""
  #   batch:
  #     export_interval: 30s
  #     export_timeout: 10s
  #   retry:
  #     enabled: true
  #     max_elapsed_time: 300s

server:
  # Bind to loopback by default. Change to ":8080" to expose on all interfaces
  # (e.g. when running in a container or behind a reverse proxy).
  listen: "127.0.0.1:8080"

probes:
  - name: ping-google-dns
    type: icmp
    target: "dns.google"   # can be hostname or address
    source_ip: "192.168.1.10"   # must be an IP assigned to a local interface
    probe_every: 10s
    timeout: 2s
    count: 5
    labels:
      probe_id: "wan0"
      site: "primary"

  - name: ping-cloudflare-dns
    type: icmp
    target: "1.1.1.1"
    source_ip: "192.168.1.10"
    probe_every: 30s
    labels:
      probe_id: "wan0"
