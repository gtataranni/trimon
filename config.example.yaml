global:
  interval: 30s      # default probe interval
  timeout: 5s        # default probe timeout
  count: 3           # default ICMP echo count
  source_ip: ""      # set a daemon-wide source IP or override per probe

exporters:
  stdout:
    enabled: true
    format: json     # json | text

server:
  listen: ":8080"    # HTTP server for /healthz and /metrics

probes:
  - name: ping-google-dns
    type: icmp
    target: "8.8.8.8"
    source_ip: "192.168.1.10"   # must be an IP assigned to a local interface
    interval: 10s
    timeout: 2s
    count: 5
    labels:
      probe_id: "wan0"
      site: "primary"

  - name: ping-cloudflare-dns
    type: icmp
    target: "1.1.1.1"
    source_ip: "192.168.1.10"
    interval: 30s
    labels:
      probe_id: "wan0"
